version: 2
# .github/workflows/dependabot-auto-merge.yml merges the grouped patch and
# minor pull request once CI is green.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: '[platform]'
    groups:
      patch-and-minor:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: '[platform]'
    groups:
      patch-and-minor:
        update-types: [minor, patch]
