format:
  # This project's history predates Conventional Commits and uses `[tag]`
  # subjects throughout, so its own changelog is generated the old way
  commit_style: delimited
  format_string: ' - << message >> - << commit_type_hyperlink >>'
  section_infos:
  # Footers are read whichever style the subjects use, so this works despite
  # the delimited setting above — and means a release can describe what it
  # breaks without the note being written by hand afterwards
  - capitalizes_message: true
    format_string: ' - << message >> — << breaking_change >> - << commit_type_hyperlink >>'
    tags:
    - breaking
    title: Breaking Changes
  - capitalizes_message: true
    tags:
    - feature
    - features
    title: Features
  - capitalizes_message: true
    tags:
    - bug fix
    - bug
    - bugfix
    - bug-fix
    title: Bug Fixes
  - capitalizes_message: true
    tags:
    - platform
    - ci
    - tooling
    - upgrade
    - cleanup
    - clean up
    - refactor
    - tests
    - docs
    title: Platform Improvements
git:
  repo_base_url: https://github.com/namolnad/finch
resolution_commands:
  build_number: /usr/bin/env bash -c 'git -C $PROJECT_DIR rev-list $NEW_VERSION --count'


