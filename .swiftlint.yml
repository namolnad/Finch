opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - explicit_init
  - implicit_return
  - joined_default_parameter
  - multiline_parameters
  - nimble_operator
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - single_test_class
  - unneeded_parentheses_in_closure_argument
  - private_over_fileprivate
  - sorted_imports

custom_rules:
  # A condition long enough for SwiftFormat to wrap is long enough to deserve a
  # name. `let isStrandingSeparator = a && b` then `if isStrandingSeparator {`
  # reads better than five clauses stacked above a brace, and sidesteps the
  # disagreement between SwiftFormat's wrapping and SwiftLint's opening_brace.
  # Multi-line `guard`s are untouched: `guard … else { return }` reads fine.
  named_multiline_condition:
    name: "Named Multiline Condition"
    regex: '(?m)^[ \t]*if[ \t]*$'
    message: "Name a multi-line condition — `let isThing = a && b`, then `if isThing {`"
    severity: warning

included:
  - Sources
  - Tests

excluded: # paths to ignore during linting. Takes precedence over `included`.
  - Carthage
  - fastlane
  - Pods
  - Vendor
  - build
  - Tests

nesting:
  type_level: 3

